name: Test and deploy dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Refreshes the Donut HUD's prices. GitHub starts scheduled runs late when
    # it's busy, so expect a new price every 5 to 15 minutes.
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  # Price refreshes queue separately so they never cancel a push's tests.
  group: pages-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      donut-status: ${{ steps.donut.outputs.status }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: github.event_name != 'schedule'
        run: npm test
      # The published site is the dashboard page plus generated demo data; it
      # holds nothing from anyone's machine.
      - run: npm run build:pages
      # Donut HUD (/donut/): checks DonutSMP's auction house and adds the
      # result to the price history already on the published site. Pull
      # requests build the page without prices.
      - id: donut
        name: Check DonutSMP prices
        run: node donut/build.js _site/donut ${{ github.event_name != 'pull_request' && '--from-site' || '' }}
        env:
          DONUTSMP_API_KEY: ${{ github.event_name != 'pull_request' && secrets.DONUTSMP_API_KEY || '' }}
          DONUT_SITE_URL: ${{ vars.DONUT_SITE_URL }}
      - if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.donut.outputs.status != 'no_key')
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    # Scheduled runs only refresh prices, so they skip deploying until the
    # DONUTSMP_API_KEY secret is set.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'schedule' || needs.build.outputs.donut-status != 'no_key')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
